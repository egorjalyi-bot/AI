<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LYOSE AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0b0f;
      color: #fff;
      font-family: Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 65px;
      display: flex;
      align-items: center;
      padding: 0 18px;
      border-bottom: 1px solid #292932;
      background: #101016;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #cda7ff;
    }

    .status {
      margin-left: auto;
      font-size: 12px;
      color: #777;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 14px 110px;
    }

    .message {
      max-width: 850px;
      margin: 0 auto 18px;
      display: flex;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 85%;
      padding: 13px 16px;
      border-radius: 18px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .ai .bubble {
      background: #181820;
      border: 1px solid #292932;
      border-bottom-left-radius: 5px;
    }

    .user .bubble {
      background: #6e2cff;
      border-bottom-right-radius: 5px;
    }

    .welcome {
      text-align: center;
      margin-top: 18vh;
    }

    .welcome h1 {
      font-size: 42px;
      margin: 0 0 10px;
      background: linear-gradient(90deg, #fff, #bd8cff);
      -webkit-background-clip: text;
      color: transparent;
    }

    .welcome p {
      color: #858592;
      font-size: 15px;
    }

    .input-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px;
      background: linear-gradient(transparent, #0b0b0f 25%);
    }

    .input-box {
      max-width: 850px;
      margin: auto;
      display: flex;
      gap: 8px;
      background: #17171f;
      border: 1px solid #30303b;
      border-radius: 18px;
      padding: 8px;
    }

    textarea {
      flex: 1;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font-size: 16px;
      padding: 10px;
      min-height: 42px;
      max-height: 130px;
      font-family: inherit;
    }

    textarea::placeholder {
      color: #70707b;
    }

    button {
      width: 45px;
      height: 45px;
      border: 0;
      border-radius: 13px;
      background: #7130ff;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    button:active {
      transform: scale(.94);
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .typing {
      display: inline-flex;
      gap: 4px;
      padding: 5px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #aaa;
      animation: blink 1.2s infinite;
    }

    .dot:nth-child(2) {
      animation-delay: .15s;
    }

    .dot:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes blink {
      0%, 80%, 100% {
        opacity: .25;
      }
      40% {
        opacity: 1;
      }
    }

    .error {
      color: #ff7777;
    }

    @media (max-width: 600px) {
      .welcome h1 {
        font-size: 35px;
      }

      .bubble {
        max-width: 90%;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="logo">LYOSE</div>
    <div class="status" id="status">AI ONLINE</div>
  </header>

  <main class="chat" id="chat">

    <div class="welcome" id="welcome">
      <h1>LYOSE</h1>
      <p>Твой AI-помощник</p>
    </div>

  </main>

  <div class="input-area">
    <div class="input-box">

      <textarea
        id="message"
        placeholder="Напиши сообщение LYOSE..."
        rows="1"
      ></textarea>

      <button id="send">➤</button>

    </div>
  </div>

</div>

<script>

const API_URL = "https://ai-qnsr.onrender.com/chat";

const chat = document.getElementById("chat");
const input = document.getElementById("message");
const send = document.getElementById("send");
const welcome = document.getElementById("welcome");
const statusText = document.getElementById("status");

let busy = false;

function addMessage(text, type) {

  if (welcome) {
    welcome.remove();
  }

  const message = document.createElement("div");
  message.className = "message " + type;

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  bubble.textContent = text;

  message.appendChild(bubble);
  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;

  return message;
}

function addTyping() {

  if (welcome) {
    welcome.remove();
  }

  const message = document.createElement("div");
  message.className = "message ai";
  message.id = "typing";

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  bubble.innerHTML = `
    <div class="typing">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  `;

  message.appendChild(bubble);
  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {

  const typing = document.getElementById("typing");

  if (typing) {
    typing.remove();
  }
}

async function sendMessage() {

  const text = input.value.trim();

  if (!text || busy) {
    return;
  }

  busy = true;
  send.disabled = true;

  addMessage(text, "user");

  input.value = "";
  input.style.height = "42px";

  addTyping();

  statusText.textContent = "LYOSE THINKING...";

  try {

    const response = await fetch(API_URL, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: text
      })

    });

    const data = await response.json();

    removeTyping();

    if (!response.ok) {

      throw new Error(
        data.error ||
        "Ошибка сервера"
      );

    }

    const answer =
      data.reply ||
      data.message ||
      data.response ||
      "LYOSE не вернул ответ.";

    addMessage(answer, "ai");

    statusText.textContent = "AI ONLINE";

  } catch (error) {

    removeTyping();

    addMessage(
      "Ошибка подключения к LYOSE:\n" + error.message,
      "ai"
    );

    statusText.textContent = "CONNECTION ERROR";

  }

  busy = false;
  send.disabled = false;

  input.focus();
}

send.addEventListener("click", sendMessage);

input.addEventListener("keydown", function(event) {

  if (event.key === "Enter" && !event.shiftKey) {

    event.preventDefault();

    sendMessage();

  }

});

input.addEventListener("input", function() {

  this.style.height = "42px";

  this.style.height =
    Math.min(this.scrollHeight, 130) + "px";

});

</script>

</body>
</html>
